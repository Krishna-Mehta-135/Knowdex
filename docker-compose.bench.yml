services:
  redis-bench:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:16379:6379'
    cpus: '1.0'
    mem_limit: 256m
    cpuset: '0'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 15

  postgres-bench:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: knowdex
      POSTGRES_PASSWORD: knowdex
      POSTGRES_DB: knowdex
    ports:
      - '127.0.0.1:15432:5432'
    volumes:
      - postgres_bench_data:/var/lib/postgresql/data
    cpus: '1.0'
    mem_limit: 384m
    cpuset: '0'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U knowdex -d knowdex']
      interval: 2s
      timeout: 2s
      retries: 15

  seed-bench:
    image: postgres:15-alpine
    profiles: ['seed']
    environment:
      PGPASSWORD: knowdex
    volumes:
      - ./bench/seed.sql:/seed/seed.sql:ro
    command: ['psql', '-h', 'postgres-bench', '-U', 'knowdex', '-d', 'knowdex', '-v', 'ON_ERROR_STOP=1', '-f', '/seed/seed.sql']

  fake-gemini:
    build: ./bench/fake-gemini
    ports:
      - '127.0.0.1:19000:9000'
    cpus: '1.0'
    mem_limit: 256m
    cpuset: '0'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:9000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 15

  generator-bench:
    build:
      context: .
      dockerfile: bench/generator/Dockerfile
    ports:
      - '127.0.0.1:19100:9100'
    volumes:
      - ./bench/results:/app/results
    cpus: '2.0'
    mem_limit: 256m
    cpuset: '2-3'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:9100/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 15

  http-backend-bench:
    build:
      context: .
      dockerfile: apps/http-backend/Dockerfile
      target: runner
    ports:
      - '127.0.0.1:18000:8000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://knowdex:knowdex@postgres-bench:5432/knowdex
      REDIS_URL: redis://redis-bench:6379
      HTTP_PORT: 8000
      JWT_SECRET: projectbench-local-only
      GEMINI_API_KEY: projectbench-fake-key
      GEMINI_BASE_URL: http://fake-gemini:9000
      GEMINI_MODEL: fake-gemini
      FRONTEND_URL: http://localhost:13000
    depends_on:
      redis-bench:
        condition: service_healthy
      postgres-bench:
        condition: service_healthy
    cpus: '2.0'
    mem_limit: 384m
    cpuset: '0-1'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30

  ws-backend-bench:
    build:
      context: .
      dockerfile: apps/ws-backend/Dockerfile
      target: runner
    ports:
      - '127.0.0.1:18080:8080'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://knowdex:knowdex@postgres-bench:5432/knowdex
      REDIS_URL: redis://redis-bench:6379
      WS_PORT: 8080
      JWT_SECRET: projectbench-local-only
      GEMINI_API_KEY: projectbench-fake-key
      GEMINI_BASE_URL: http://fake-gemini:9000
      GEMINI_MODEL: fake-gemini
    depends_on:
      redis-bench:
        condition: service_healthy
      postgres-bench:
        condition: service_healthy
    cpus: '2.0'
    mem_limit: 384m
    cpuset: '0-1'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8080/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgres_bench_data:
