name: Deploy

# Push to main → CI → build images to GHCR → deploy to the shared Azure App VM
# → Vercel.
#
# The Knowdex backend runs on the same Azure App VM as CanvasSync, in
# /opt/knowdex (see docker-compose.prod.yml). CanvasSync's Caddy terminates
# HTTPS for api.knowdex.me / ws.knowdex.me and proxies over the `edge` network.
# Postgres (database `knowdex_db`) and Redis are shared with CanvasSync.
#
# Required GitHub variables:
#   APP_VM_IP            — App VM public IP
#   DATA_VM_PRIVATE_IP   — Data VM private IP (Redis)
#   API_HEALTH_URL       — https://api.knowdex.me/health
#
# Required GitHub secrets:
#   VM_USER, VM_SSH_KEY  — same values as in the CanvasSync repo
#   DATABASE_URL         — Azure Postgres …/knowdex_db?sslmode=require
#   REDIS_PASS           — same value as in the CanvasSync repo
#   JWT_SECRET, GEMINI_API_KEY,
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GH_CLIENT_ID, GH_CLIENT_SECRET,
#   VERCEL_DEPLOY_HOOK
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; cancel any in-flight run when a new commit lands.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Gate: CI must pass before we ship anything ──────────────────────────────
  ci-check:
    name: Verify CI green
    uses: ./.github/workflows/ci.yml

  # ── Build & push all images in parallel ─────────────────────────────────────
  build-and-push:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: ci-check

    permissions:
      contents: read
      packages: write   # required to push to GHCR

    strategy:
      fail-fast: false  # keep building other images if one fails
      matrix:
        include:
          - service: http-backend
            dockerfile: apps/http-backend/Dockerfile
          - service: ws-backend
            dockerfile: apps/ws-backend/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Docker image names must be lowercase
      - name: Derive lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract Docker metadata (tags + labels) from Git context
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # The App VM is x86, so amd64 images are enough.
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: runner
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scope the GHA layer cache per service so they don't overwrite each other
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          provenance: false   # keeps manifest lists simple for standard registries

  # ── Deploy to the shared Azure App VM ───────────────────────────────────────
  deploy:
    name: Deploy to Azure App VM
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy docker-compose to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.APP_VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/opt/knowdex/"

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.APP_VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/knowdex

            # Force the repo name to lowercase for the pull
            LOWER_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

            # Write runtime env from GitHub Secrets so no secrets live in the image
            cat > .env <<EOF
            GITHUB_REPO=$LOWER_REPO
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            REDIS_URL=redis://:${{ secrets.REDIS_PASS }}@${{ vars.DATA_VM_PRIVATE_IP }}:6379
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            FRONTEND_URL=https://knowdex.me
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            GOOGLE_CALLBACK_URL=https://api.knowdex.me/api/v1/auth/google/callback
            GH_CLIENT_ID=${{ secrets.GH_CLIENT_ID }}
            GH_CLIENT_SECRET=${{ secrets.GH_CLIENT_SECRET }}
            GH_CALLBACK_URL=https://api.knowdex.me/api/v1/auth/github/callback
            EOF
            chmod 600 .env

            docker network inspect edge >/dev/null 2>&1 || docker network create edge

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            # http-backend applies Prisma migrations on start (see its Dockerfile CMD).
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

  # ── Wait for backend health, then deploy Vercel ─────────────────────────────
  # Prerequisites:
  #   1. Disable "Auto Deploy" in Vercel project settings (Settings → Git → Auto Deploy → off)
  #   2. Create a Deploy Hook (Settings → Git → Deploy Hooks) and store the URL
  #      as the VERCEL_DEPLOY_HOOK secret in GitHub.
  deploy-vercel:
    name: Deploy frontend to Vercel
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Wait for backend health
        run: |
          for i in $(seq 1 20); do
            if curl -sf --max-time 10 "${{ vars.API_HEALTH_URL }}" > /dev/null 2>&1; then
              echo "✓ backend is healthy"
              exit 0
            fi
            echo "attempt $i/20 — retrying in 10s"
            sleep 10
          done
          echo "backend never became healthy"
          exit 1

      - name: Trigger Vercel deploy hook
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}")
          if echo "$STATUS" | grep -qE '^(200|201)$'; then
            echo "Vercel deploy triggered successfully (HTTP $STATUS)."
          else
            echo "Vercel deploy hook returned HTTP $STATUS — failing."
            exit 1
          fi
