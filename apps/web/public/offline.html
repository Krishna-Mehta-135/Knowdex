<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Knowdex</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0a0b;
        color: #f2f2f2;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 26rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: #a1a1aa;
        margin: 0.25rem 0 1.25rem;
      }
      button {
        background: #8b6cf7;
        color: #fff;
        border: 0;
        border-radius: 0.6rem;
        padding: 0.6rem 1.1rem;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        Notes you've already opened are still available. Pages you haven't
        visited need a connection.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
