# docker-compose.prod.yml — Knowdex backend on the shared Azure App VM
# ─────────────────────────────────────────────────────────────────────────────
# Runs in /opt/knowdex next to the CanvasSync stack (/opt/canvas). No ports are
# published: CanvasSync's Caddy reaches these containers over the external
# `edge` network and terminates HTTPS for api.knowdex.me / ws.knowdex.me.
#
# Database → Azure Postgres Flexible Server (database `knowdex_db`)
# Redis    → shared Redis container on the Data VM (ws pub/sub only)
#
# The deploy workflow writes /opt/knowdex/.env from GitHub secrets.
# Service names are prefixed with `knowdex-` so they never collide with
# CanvasSync's `http-backend` / `ws-backend` names on the shared network.
# ─────────────────────────────────────────────────────────────────────────────

services:
  knowdex-http:
    image: ghcr.io/${GITHUB_REPO:?GITHUB_REPO is required}/http-backend:latest
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=192
      HTTP_PORT: 8000
      DATABASE_URL: ${DATABASE_URL:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:?required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      GH_CLIENT_ID: ${GH_CLIENT_ID:-}
      GH_CLIENT_SECRET: ${GH_CLIENT_SECRET:-}
      GH_CALLBACK_URL: ${GH_CALLBACK_URL:-}
    networks:
      - edge
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 256m
    restart: unless-stopped

  knowdex-ws:
    image: ghcr.io/${GITHUB_REPO:?GITHUB_REPO is required}/ws-backend:latest
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=192
      WS_PORT: 8080
      DATABASE_URL: ${DATABASE_URL:?required}
      REDIS_URL: ${REDIS_URL:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
      - edge
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 256m
    restart: unless-stopped

networks:
  edge:
    external: true
